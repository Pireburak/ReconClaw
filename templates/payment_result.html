<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v={{ asset_v }}">
</head>
<body class="public pay-result">
<main class="doc" id="payResult" data-next="{{ next }}">
    <h1>{{ 'Ödemeniz alındı' if ok else 'Ödeme tamamlanamadı' }}</h1>
    <p>{{ 'Planınız onaylandıktan sonra birkaç saniye içinde hesabınızda etkinleşir.' if ok
          else 'Kartınızdan çekim yapılmadı. Bilgilerinizi kontrol edip tekrar deneyebilirsiniz.' }}</p>
    <p><a class="btn primary" href="{{ next }}" target="_top">PANELE DÖN</a></p>
</main>
<script src="{{ url_for('static', path='js/payment-return.js') }}?v={{ asset_v }}"></script>
</body>
</html>
